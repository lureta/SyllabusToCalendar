<!DOCTYPE html>
<html>
<head>
  <title>Syllabus Parser</title>
  <style>
    body {
      width: 340px;
      font-family: Arial, sans-serif;
      padding: 10px;
      box-sizing: border-box;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 6px;
    }
    textarea {
      width: 100%;
      height: 130px;
      resize: vertical;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 12px;
      padding: 6px;
    }
    button {
      margin-top: 8px;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    #aiParseBtn {
      background-color: #16a34a;
      color: white;
    }
    #logEventsBtn {
      background-color: #e5e7eb;
      color: #111827;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 11px;
    }
    th {
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 4px;
    }
    td {
      padding-top: 4px;
      vertical-align: top;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      font-size: 11px;
      padding: 3px;
    }
    .hint {
      font-size: 10px;
      color: #6b7280;
      margin-bottom: 4px;
    }
    .year-input {
      font-size: 11px;
      margin-bottom: 6px;
    }
    .year-input input {
      width: 60px;
      font-size: 11px;
      padding: 2px 4px;
      margin-left: 4px;
    }
    .addBtn {
      font-size: 11px;
      padding: 4px 6px;
      width: auto;
      background-color: #f97316;
      color: white;
    }
    .pdf-input {
      font-size: 11px;
      margin-top: 6px;
      margin-bottom: 4px;
    }
    .pdf-input input {
      margin-top: 2px;
      width: 100%;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <h2>Syllabus → Exam Finder</h2>

  <div class="hint">
    Paste your syllabus text or upload a PDF, then use AI to find quizzes and exams.
  </div>

  <div class="hint year-input">
    Event year:
    <input id="yearInput" type="text" value="2025">
  </div>

  <textarea id="syllabus" placeholder="Paste syllabus here..."></textarea>

  <div class="pdf-input">
    Or upload a syllabus PDF:
    <input id="pdfInput" type="file" accept="application/pdf">
  </div>

  <button id="aiParseBtn">AI Parse</button>

  <div id="results"></div>

  <button id="logEventsBtn" style="margin-top:10px; display:none;">
    Show parsed events in console
  </button>

  <script src="popup.js"></script>
</body>
</html>
